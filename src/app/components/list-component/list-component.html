<div class="flex gap-5">
    @for (item of characters(); track item.id) {
    <div class="bg-white p-4 min-w-60 flex flex-col gap-4 rounded-2xl">
        <span (click)="emitDeleteCharacter(item.id)" class="cursor-pointer text-end">X</span>
        <div>
            <p class="text-black font-medium">Nombre: {{item.nombre}}</p>
            <p class="text-black font-medium">Poder: {{item.poder}}</p>
            <p class="text-black font-medium">Daño: {{item.dano}}</p>
        </div>
    </div>
    }
</div>
